# Builds the datapack zip and uploads it as a CI artifact
name: Build

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pull first vx.y.z from pack.mcmeta. This is then used to name the zip file accordingly. Skip the rest of the job if missing
      - name: Read version from pack.mcmeta
        id: version
        run: |
          VERSION=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' pack.mcmeta | head -n1)
          if [ -z "$VERSION" ]; then
            echo "No vx.y.z found in pack.mcmeta, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Zip the pack files for distribution
      - name: Build datapack
        if: steps.version.outputs.skip != 'true'
        run: zip -r "ChunkyOffline-${{ steps.version.outputs.version }}.zip" pack.mcmeta pack.png data LICENSE README.md

      # Upload the zip as a workflow artifact
      - name: Upload artifact
        if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ChunkyOffline-${{ steps.version.outputs.version }}
          path: ChunkyOffline-${{ steps.version.outputs.version }}.zip
